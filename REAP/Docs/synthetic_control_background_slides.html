  <template id="s0">
    <h1>Synthetic control: estimating the untreated path</h1>
    <p class="muted">How three papers build a counterfactual for a single treated unit — from interpretable donor weights, to bias correction when the hull fails, to using time order that classical synthetic control ignores.</p>
    <div class="grid c3">
      <div class="stat"><b>2010</b><span>ADH · California tobacco</span></div>
      <div class="stat"><b>2021</b><span>Ben-Michael et al. · ASCM</span></div>
      <div class="stat"><b>2026</b><span>Rho et al. · TASC</span></div>
    </div>
    <div class="callout info"><strong>The question that does not change</strong>After an intervention, we observe the treated unit. The causal effect is that path minus Y(0): what would have happened without the intervention. Y(0) is never observed, so it must be constructed.</div>
  </template>

  <template id="s1">
    <h1>Paper 1 · the problem to solve</h1>
    <p>Abadie, Diamond, and Hainmueller (2010) study California’s 1988 tobacco control program. After the intervention we see California’s smoking rate. To isolate the program’s effect we need the untreated case: a California that never passed the law.</p>
    <div class="grid c2">
      <div>
        <h2>What we observe</h2>
        <p>The treated unit after T0 follows Y(1). Donors never receive the intervention, so their whole path is Y(0).</p>
        <p class="muted">California after 1988 is the factual series. Other states are the pool of possible comparisons.</p>
      </div>
      <div>
        <h2>What we need</h2>
        <p>The missing counterfactual Y(0) for the treated unit after T0. The effect is the gap: observed California minus synthetic California.</p>
        <p class="muted">A naive comparison (California vs. the rest of the US) confounds the law with pre-existing differences.</p>
      </div>
    </div>
    <svg viewBox="0 0 640 168" role="img" aria-label="Treated path versus missing untreated path">
      <line x1="48" y1="132" x2="600" y2="132" stroke="#8a877e" />
      <line x1="320" y1="20" x2="320" y2="132" stroke="#5c5a54" stroke-dasharray="4 4" />
      <text x="328" y="18" fill="#8a877e" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">intervention T0</text>
      <text x="48" y="162" fill="#8a877e" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">pre-period · match</text>
      <text x="344" y="162" fill="#8a877e" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">post-period · Y(0) is missing</text>
      <polyline fill="none" stroke="#1c1b18" stroke-width="2.5" points="48,88 120,80 200,84 320,70 400,48 500,40 600,36" />
      <polyline fill="none" stroke="#1f4e79" stroke-width="2.5" stroke-dasharray="6 4" points="320,70 400,78 500,86 600,92" />
      <text x="530" y="32" fill="#1c1b18" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">observed Y(1)</text>
      <text x="508" y="108" fill="#1f4e79" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">missing Y(0)</text>
    </svg>
    <p class="small">Schematic: the solid line is what we see; the dashed line is the untreated path synthetic control must construct. The vertical gap after T0 is the estimated effect.</p>
    <div class="callout neutral"><strong>Why this is harder than a regression of Y on X</strong>We are not predicting California from covariates in the usual sense. We are imputing a missing potential outcome from other real places, and the construction itself has to be a credible “what if.”</div>
  </template>

  <template id="s2">
    <h1>Why ordinary regression is a poor synthetic unit</h1>
    <p>One could regress California’s pre-period outcomes on the donor states and use those coefficients as weights. ADH reject that as the primary estimator for two linked reasons.</p>
    <div class="grid c2">
      <div class="card">
        <h3>Lack of interpretation</h3>
        <p>Least squares freely assigns negative coefficients. A weight of −3.7 on one state and +4.2 on another is not a recipe for a place. The “synthetic California” cannot be read as a mixture of real donors.</p>
        <p class="muted">The causal claim then hides inside an algebraic fit rather than in a transparent donor list.</p>
      </div>
      <div class="card">
        <h3>Unrealistic extrapolation</h3>
        <p>Negative and large weights leave the range of observed donor data. The estimator invents a comparison unit that does not exist — a combination no actual state could occupy.</p>
        <p class="muted">If the treated unit is unusual, regression will still produce a number. That number need not correspond to any real untreated path.</p>
      </div>
    </div>
    <div class="callout warn"><strong>The design constraint that follows</strong>The synthetic unit should be a weighted average of real untreated donors, not an unconstrained linear projection. That is the move from regression to synthetic control.</div>
  </template>

  <template id="s3">
    <h1>Paper 1 · method and the convex-hull constraints</h1>
    <p>Choose donor weights that match California’s pre-treatment path (and covariates), then hold those weights fixed after 1988. The post-period weighted donor average is synthetic California — the estimate of Y(0).</p>
    <h2>Two constraints that define the convex hull</h2>
    <div class="grid c2">
      <div class="card">
        <h3>1. Non-negative weights · w ≥ 0</h3>
        <p>No shorting a donor. Every state that enters the synthetic unit enters with a positive share. This restores interpretability: California ≈ 0.33 Utah + 0.23 Nevada + …</p>
      </div>
      <div class="card">
        <h3>2. Weights sum to one · Σw = 1</h3>
        <p>The synthetic unit is a convex combination, not a scaled or shifted projection. It must sit inside the cloud of real donors, not outside it.</p>
      </div>
    </div>
    <div class="grid c2" style="margin-top:12px">
      <div>
        <h3>Inside the hull · SC can match</h3>
        <svg viewBox="0 0 280 160" role="img" aria-label="Treated unit inside the donor convex hull">
          <polygon points="40,120 90,40 200,36 250,100 180,140" fill="#e7eef4" stroke="#d9d6cc" />
          <circle cx="40" cy="120" r="4" fill="#5c5a54" /><circle cx="90" cy="40" r="4" fill="#5c5a54" />
          <circle cx="200" cy="36" r="4" fill="#5c5a54" /><circle cx="250" cy="100" r="4" fill="#5c5a54" />
          <circle cx="180" cy="140" r="4" fill="#5c5a54" /><circle cx="120" cy="90" r="4" fill="#5c5a54" />
          <circle cx="160" cy="70" r="4" fill="#5c5a54" /><circle cx="150" cy="88" r="6" fill="#1f4e79" />
          <text x="12" y="18" fill="#8a877e" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">donors · treated unit (accent)</text>
        </svg>
        <p class="muted">A convex combination of donors can reproduce the treated pre-path.</p>
      </div>
      <div>
        <h3>Outside the hull · SC cannot</h3>
        <svg viewBox="0 0 280 160" role="img" aria-label="Treated unit outside the donor convex hull">
          <polygon points="40,120 90,40 200,36 250,100 180,140" fill="#e7eef4" stroke="#d9d6cc" />
          <circle cx="40" cy="120" r="4" fill="#5c5a54" /><circle cx="90" cy="40" r="4" fill="#5c5a54" />
          <circle cx="200" cy="36" r="4" fill="#5c5a54" /><circle cx="250" cy="100" r="4" fill="#5c5a54" />
          <circle cx="180" cy="140" r="4" fill="#5c5a54" /><circle cx="120" cy="90" r="4" fill="#5c5a54" />
          <circle cx="160" cy="70" r="4" fill="#5c5a54" /><circle cx="248" cy="28" r="6" fill="#1f4e79" />
          <text x="12" y="18" fill="#8a877e" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">ceiling / extreme treated unit</text>
        </svg>
        <p class="muted">No non-negative, summing-to-one weights can reach the treated unit. That is the ceiling-state failure.</p>
      </div>
    </div>
    <div class="callout danger"><strong>The price of staying inside the hull</strong>If the treated unit is extreme — a ceiling state, an outlier on the pre-period path — no convex blend of donors can match it. Pre-treatment fit fails, and ADH’s rule is not to use synthetic control in that case. That hole is what paper 2 fills.</div>
  </template>

  <template id="s4">
    <h1>Paper 2 · Augmented Synthetic Control (2021)</h1>
    <p>Ben-Michael, Feller, and Rothstein keep classical SCM as the starting point. They do not return to unconstrained regression. They bias-correct SCM when pre-treatment match is imperfect — the typical case when the treated unit sits near or outside the donor hull.</p>
    <h2>Two stages</h2>
    <div class="grid c2">
      <div class="card">
        <h3>Stage 1 · fit ordinary SCM</h3>
        <p>Estimate simplex weights exactly as in paper 1. If pre-period fit is already excellent, stop: ASCM ≈ SCM.</p>
        <p class="muted">This remains the interpretable baseline. The correction is added only for leftover imbalance.</p>
      </div>
      <div class="card">
        <h3>Stage 2 · ridge bias correction</h3>
        <p>Among donors, fit a ridge outcome model: how post-period Y relates to pre-period X. Use it to estimate the bias implied by residual pre-period mismatch, then subtract that bias from the SCM estimate.</p>
        <p class="muted">Equivalently, Ridge ASCM weights = SCM weights + a ridge correction that may be slightly negative.</p>
      </div>
    </div>
    <h2>What “allowing negative weights” actually means</h2>
    <p>Donors are still real units. Negative weights do let the synthetic unit leave the convex hull — that is the point, so extreme units can be matched. The ridge penalty λ penalizes distance from the original SCM weights, so extrapolation is limited rather than free. Unconstrained regression has no such tether.</p>
    <div class="callout info"><strong>The knob</strong>λ interpolates between “stay inside the hull” (SCM) and “leave it just enough to improve pre-fit” (ASCM). That is why this is the natural next estimator when a treated site cannot be written as a convex blend of a small donor pool.</div>
  </template>

  <template id="s5">
    <h1>Paper 3 · Time-Aware Synthetic Control (2026)</h1>
    <p>Rho, Illick, Narasipura, Abadie, Hsu, and Misra address a different limitation than ASCM. Classical SC, PCA-based robust SC, and matrix completion are permutation-invariant in pre-intervention time: shuffling the dates does not change the estimate. Trend information is wasted.</p>
    <h2>Method</h2>
    <div class="grid c2">
      <div>
        <h3>State-space model</h3>
        <p>A low-dimensional latent state evolves with a stable trend: x(t) = A x(t−1) + noise. Observations are a low-rank readout: y(t) = H x(t) + noise. Parameters are learned on the pre-period only, with EM, a Kalman filter, and an RTS smoother.</p>
        <p class="muted">This is a branch from the SC / latent-factor family, not a return to unconstrained regression, and not a continuation of ASCM’s hull problem.</p>
      </div>
      <div>
        <h3>Infinite observation variance</h3>
        <p>For counterfactual inference, the treated unit’s post-intervention outcomes are treated as missing. Their observation-noise variance is set to infinity, so the Kalman gain on that coordinate is zero.</p>
        <p class="muted">This is not ASCM-style debiasing of poor pre-fit. It stops contaminated post-treatment Y from updating the latent state. Donors’ post-period data and the learned trend A still inform Ŷ(0).</p>
      </div>
    </div>
    <div class="callout warn"><strong>When this helps — and when it does not</strong>TASC is useful when a consistent trend exists and observations are noisy. It does not preserve readable simplex weights. If the trend is weak, or if there is only a single pre-period composite, there is no time order to exploit and ordinary SC remains the right starting point.</div>
  </template>

  <template id="s6">
    <h1>How the three papers sit together</h1>
    <table>
      <thead>
        <tr><th>Paper</th><th>Problem it attacks</th><th>What it keeps</th><th>What it gives up</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>ADH 2010</td>
          <td>Regression extrapolates; weights unreadable</td>
          <td>Simplex weights; a blend of real donors</td>
          <td>Cannot fit units outside the convex hull</td>
        </tr>
        <tr>
          <td>ASCM 2021</td>
          <td>Poor pre-fit / treated unit outside the hull</td>
          <td>SCM as the base, then a small correction</td>
          <td>Some negative weights; limited extrapolation</td>
        </tr>
        <tr>
          <td>TASC 2026</td>
          <td>Time order is ignored by SC / PCA / matrix completion</td>
          <td>Latent-factor / low-rank SC idea</td>
          <td>Simplex weights; needs a real time trend</td>
        </tr>
      </tbody>
    </table>
    <h2>One-line takeaway</h2>
    <p>Paper 1 invents the interpretable untreated twin. Paper 2 repairs that twin when the treated unit cannot sit inside the donor hull. Paper 3 keeps the SC idea but uses time dynamics instead of a static weighted average — a different branch, useful only once a genuine pre-period time series exists.</p>
  </template>

  <template id="s7">
    <h1>From a scalar path to an embedding as the SC input</h1>
    <p>Classical synthetic control matches a short numeric series — California’s smoking rate, or GDP. The project’s extra claim is that a <em>learned representation</em> can stand in for that pre-state: if a unit is really 0.9 A + 0.1 B in the embedding, the same simplex program should return those weights.</p>
    <div class="grid c2">
      <div class="card">
        <h3>What ADH was designed for</h3>
        <p>A handful of interpretable numbers over calendar time. The solver matches that path, then carries the weights forward as Y(0).</p>
        <p class="muted">The method never required the outcome to be one-dimensional, but every canonical example is a scalar (or a few covariates), not a 768-d network vector.</p>
      </div>
      <div class="card">
        <h3>What we need to show first</h3>
        <p>That convex-mixture geometry still exists in a text embedding of real clinical notes — otherwise fitted weights on Helene chips or image embeddings are decoration.</p>
        <p class="muted">Real patients have no true mix, so the test plants the recipe, hides it, and grades recovery. That is a necessary condition for embedding-SC, not a treatment-effect estimate.</p>
      </div>
    </div>
    <div class="callout info"><strong>The operational question (final report §1)</strong>If the true mixing weight is 0.9, does the method recover ≈ 0.9 — in a latent space learned from clinical text?</div>
    <p class="src">Sources: FINAL_REPORT_latent_recovery_2026-08-11.md §1; experiment_walkthrough_2026-08-11.md Steps 0–1. Numbers on the next slides are from latent/results/ artifacts, cross-checked in results_report.ipynb.</p>
  </template>

  <template id="s8">
    <h1>Workflow — plant the recipe, hide it, score recovery</h1>
    <p>n2c2 2018 Track 1 / i2b2 2014 longitudinal corpus: <strong>288 patients, 1,264 notes</strong> (mean 4.4 per patient). Same simplex estimator as paper 1: minimize ‖z − Σ wⱼ zⱼ‖² subject to wⱼ ≥ 0, Σ wⱼ = 1. Nothing is trained in this loop.</p>
    <div class="flow">
      <div class="flow-box">
        <div class="n">L0</div>
        <h3>Parse</h3>
        <p>Each XML → date-sorted notes. t is the index after sorting, not file order. Counts asserted against an independent inventory.</p>
      </div>
      <div class="flow-box">
        <div class="n">L1</div>
        <h3>Embed</h3>
        <p>Each note → a 768-d unit vector. Primary: Qwen3-Embedding-8B (MRL). Second arm: BioLORD-2023. Same note twice is bit-identical.</p>
      </div>
      <div class="flow-box">
        <div class="n">L2 · H1</div>
        <h3>Plant</h3>
        <p>z = Σ w* · (note vector). Two shapes: dominant 0.9/0.1, and a diffuse Dirichlet mix. Real notes, manufactured recipe.</p>
      </div>
      <div class="flow-box">
        <div class="n">Solve</div>
        <h3>Simplex QP</h3>
        <p>Hand the solver only z and a donor pool. solve_simplex_qp (SLSQP, Gram form) — the paper-1 estimator, reused unchanged.</p>
      </div>
      <div class="flow-box">
        <div class="n">Score</div>
        <h3>Recovery</h3>
        <p>L1(ŵ, w*), ŵ_max vs 0.9, top-1 donor hit rate. 500 replicates/cell, seed 0, 2,000 bootstrap resamples.</p>
      </div>
    </div>
    <h2>Three ways the claim can die (run before quoting 0.884)</h2>
    <div class="grid c3">
      <div class="card">
        <h3>Oracle gate</h3>
        <p>Pool = exactly the true donors. If recovery fails here, stop. Passed: max mean L1 = 1.46×10⁻⁵ (bar 0.01).</p>
      </div>
      <div class="card">
        <h3>All-donors + LP uniqueness</h3>
        <p>Pool = 1,263 records so true donors are present. Unconstrained solution set is 494-dimensional; nonnegativity collapses it to a single LP-certified point = w*.</p>
      </div>
      <div class="card">
        <h3>Invalid digit-string run</h3>
        <p>Same battery on billing-code “text.” Mean top-3 cosine 0.991 vs 0.710 on n2c2 prose. The test can fail; later success is not automatic.</p>
      </div>
    </div>

  <script>
    const LABELS = ["Title", "The problem", "Why not regression", "Paper 1 · method", "Paper 2 · ASCM", "Paper 3 · TASC", "How they sit", "Scalar → embedding", "Workflow", "H1 results", "What failed"];
    const n = LABELS.length;
    let i = 0;
    const stage = document.getElementById("stage");
    const pills = document.getElementById("pills");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const count = document.getElementById("count");

    LABELS.forEach((label, k) => {
      const b = document.createElement("button");
      b.className = "pill";
      b.type = "button";
      b.textContent = label;
      b.addEventListener("click", () => go(k));
      pills.appendChild(b);
    });

    function go(k) {
      i = Math.max(0, Math.min(n - 1, k));
      const tpl = document.getElementById("s" + i);
      stage.replaceChildren(tpl.content.cloneNode(true));
      [...pills.children].forEach((el, j) => el.classList.toggle("active", j === i));
      prev.disabled = i === 0;
      next.disabled = i === n - 1;
      count.textContent = (i + 1) + " / " + n;
      history.replaceState(null, "", "#s" + i);
    }

    prev.addEventListener("click", () => go(i - 1));
    next.addEventListener("click", () => go(i + 1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") go(i + 1);
      if (e.key === "ArrowLeft" || e.key === "PageUp") go(i - 1);
      if (e.key === "Home") go(0);
      if (e.key === "End") go(n - 1);
    });

    const hash = parseInt((location.hash.match(/s(\d+)/) || [])[1], 10);
    go(Number.isFinite(hash) ? hash : 0);
  </script>
