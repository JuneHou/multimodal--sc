  <template id="s0">
    <h1>Latent SCM/ASCM on the Helene biweekly panel</h1>
    <p class="muted">Encode → kNN donors → SCM/ASCM weights in the TerraMind tokenizer latent → decode. Scored against observed treated images at held-out pre-hurricane P09/P10.</p>
    <div class="grid c4">
      <div class="stat"><b>10</b><span>treated sites</span></div>
      <div class="stat"><b>50</b><span>controls with panel imagery</span></div>
      <div class="stat"><b>2,322</b><span>biweekly images encoded</span></div>
      <div class="stat"><b>980-d</b><span>quantized latent (5 × 14 × 14)</span></div>
    </div>
    <div class="callout info"><strong>The evaluation this design unlocks</strong>P09–P10 are still untreated. The observed treated chip is ground truth for the whole encode → weight → decode chain — not a comparison against another pipeline.</div>
    <p class="src">Notebooks 01–04 in notebooks/ts_SCM_ASCM/. Outline: Docs/8-21-update.md. Companion background: Docs/synthetic_control_background_slides.html.</p>
  </template>

  <template id="s1">
    <h1>Design</h1>
    <p>Two-snapshot DiD could only compare pipelines. With 10 pre-hurricane periods, P09–P10 are still untreated, so the observed treated chip is ground truth.</p>
    <div class="flow">
      <div class="flow-box">
        <div class="n">01</div>
        <h3>Encode</h3>
        <p>Every biweekly chip → TerraMind v1 quantized latent, 980-d, frozen tokenizers.</p>
      </div>
      <div class="flow-box">
        <div class="n">02</div>
        <h3>kNN donors</h3>
        <p>5 nearest controls per site × sensor, from every control that has panel imagery.</p>
      </div>
      <div class="flow-box">
        <div class="n">02–03</div>
        <h3>SCM / ASCM</h3>
        <p>Simplex weights, then ridge ASCM, fit in the 980-d latent on pre-periods only.</p>
      </div>
      <div class="flow-box">
        <div class="n">04</div>
        <h3>Decode</h3>
        <p>Synthetic latent → image. Compare to the raw observed chip at P09/P10.</p>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>Split</th><th>Fit</th><th>Score</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>Frozen joint (collaborator, notebook 14)</td>
          <td>P01–P08</td>
          <td>P09+P10 pooled</td>
        </tr>
        <tr>
          <td>Expanding (advisor)</td>
          <td>P01–P08, then P01–P09</td>
          <td>P09, then P10</td>
        </tr>
      </tbody>
    </table>
    <p class="muted" style="margin-top:10px">Sample: 10 treated × 50 controls × 2 sensors × 20 biweekly periods. Helene reference date 2024-09-27 (start of P11).</p>
  </template>

  <template id="s2">
    <h1>Encode · tokenizer latent</h1>
    <p>2,322 of 2,400 site–sensor–periods encoded with frozen TerraMind v1 tokenizers. Output is the quantized embedding <span class="path">(5, 14, 14)</span> = 980-d, the one representation used for donor search, weight fitting, and decoding. NaN fill is the chip-mean convention. All 10 treated sites have both sensors at P09 and P10.</p>
    <table>
      <thead>
        <tr><th>Sensor</th><th>Before (P01–P10)</th><th>After (P11–P20)</th></tr>
      </thead>
      <tbody>
        <tr><td>Sentinel-1</td><td>588 / 600</td><td>559 / 600</td></tr>
        <tr><td>Sentinel-2</td><td>600 / 600</td><td>575 / 600</td></tr>
      </tbody>
    </table>
    <div class="callout warn"><strong>S2 missing pixels are first-order</strong>Biweekly S2 composites average ~40% invalid pixels. Encode prep fills those NaNs with the chip mean before the tokenizer, so filled content shapes the latent. S1 is ~99.9% valid.</div>
    <p class="src">panel_latent_index.csv · data/embeddings_tok_panel/latents_biweekly.npz · notebook 01.</p>
  </template>

  <template id="s3">
    <h1>kNN donors · distance, not a second matching table</h1>
    <p>Distance = mean Euclidean distance of <em>unscaled</em> 980-d latents over shared P01–P08 periods. Keep the 5 nearest, per sensor. Search = every control that has a panel image (50), then the simplex sees those 5.</p>
    <div class="callout warn"><strong>Why not the embed_DiD 260?</strong>kNN needs encode(control image). Of the matching table’s 260 controls, 210 have no P01–P20 GeoTIFF — ranks 6–10 of these 10 treated sites, and all controls of treatments 0011–0026. They were never encoded. Searching 260 is new data collection, not a missing filter. Within the 50, this arm is already wider than notebook 14 (which used only each site’s own 5 covariate matches).</div>
    <div class="grid c2" style="margin-top:12px">
      <div>
        <h2>Neighbor distance (unscaled 980-d)</h2>
        <table class="compact">
          <thead>
            <tr><th>Sensor</th><th>Min</th><th>Median</th><th>Max</th></tr>
          </thead>
          <tbody>
            <tr><td>Sentinel-1</td><td>12.66</td><td>13.09</td><td>13.28</td></tr>

          </tbody>
        </table>
        <p class="muted">S1 is almost flat: “nearest” is not meaningfully nearer. That is the preview of RMSE ≈ 1.</p>
      </div>
      <div>
        <h2>SCM weights on those 5 (P01–P08)</h2>
        <table class="compact">
          <thead>
            <tr><th>Sensor</th><th>Max weight (median)</th><th>Effective donors (median)</th></tr>
          </thead>

            <tr><td>Sentinel-2</td><td>0.27</td><td>4.74</td></tr>
          </tbody>
        </table>
        <p class="muted">Nearly uniform. The simplex has nothing to prefer.</p>
      </div>
    </div>
    <h2>Overlap with that site’s own 5 covariate-matched controls</h2>
    <table class="compact">
      <thead>
        <tr><th></th><th>01</th><th>02</th><th>03</th><th>04</th><th>05</th><th>06</th><th>07</th><th>08</th><th>09</th><th>10</th><th>Mean</th></tr>
      </thead>
      <tbody>
        <tr><td>S1</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td><td>0.7</td></tr>
        <tr><td>S2</td><td>1</td><td>0</td><td>1</td><td>2</td><td>0</td><td>1</td><td>1</td><td>1</td><td>2</td><td>0</td><td>0.9</td></tr>

    </table>
    <p class="src">panel_knn_donors.csv (main arm) · panel_scm_weights.csv · README § Limitation.</p>
  </template>

  <template id="s4">
    <h1>Estimators and the metric</h1>
    <p>Same donors, same z-scoring, both splits. RMSE is over periods × all 980 z-scored latent dimensions. The latent is standardized with the pooled 60-site, P01–P08 mean/SD, so <strong>1.0 = 1 typical cross-site SD</strong>.</p>
    <div class="eq">
      RMSE = √ mean (z<sub>treated</sub> − Xw)²
      <div class="eq-sub">Training RMSE uses the fit window (in-sample). Validation RMSE uses held-out P09/P10 — that is the result.</div>
    </div>
    <div class="grid c2">
      <div class="card">
        <h3>SCM · simplex</h3>
        <p>Find w₁…w₅, w ≥ 0, Σw = 1. Minimize mean squared difference vs the treated latent, jointly over 980 dims (SLSQP). A weighted average — no extrapolation.</p>
      </div>
      <div class="card">
        <h3>ASCM · ridge (Ben-Michael et al. 2021)</h3>
        <p>Closed form, anchored on the SCM weights. Negative weights allowed. λ chosen by leave-one-fit-period-out CV on the fit window only.</p>
      </div>
    </div>
    <div class="callout info"><strong>A site passes only if both flags agree</strong>Ratio flag: validation / training ≲ 1.5 (no overfitting). Level flag: validation RMSE &lt; 1 SD (the fit is actually informative). Ratio alone would call a uniformly bad fit “good.”</div>
  </template>

  <template id="s6">
    <h1>Result 2 · ASCM is the same estimator</h1>
    <p>Same validation RMSE. Points sit on the diagonal: max |SCM − ASCM| &lt; 10<sup>−8</sup>. No negative weights on the main P01–P08 fit. 36 of 40 chosen λ sit on the CV grid boundary (13 at 10<sup>−4</sup>, 23 at 10<sup>4</sup>). Ridge has nothing to leverage when the donor span is this far from the target.</p>
    <div class="grid c2">
      <div class="fig">

      </div>

    <div class="callout danger"><strong>ASCM does not rescue latent SCM</strong>This is a stronger version of the collaborator’s feature-space ASCM caution: when donors cannot span the treated unit, ridge extrapolation does not create a match that was not there.</div>

  <template id="s7">
    <h1>Result 3 · decode vs the reconstruction floor</h1>
    <p>Ground truth is always the <strong>raw satellite chip</strong>. Two different images are decoded. They are not interchangeable.</p>
    <div class="grid c2">
      <div class="card">
        <h3>Synthetic counterfactual</h3>
        <p>Weighted mix of the 5 donor latents at that period, then decode. Donors and weights enter.</p>
      </div>
      <div class="card">
        <h3>Reconstruction floor</h3>
        <p>Encode→decode the <em>observed</em> treated chip. Donors never enter. This is tokenizer error if the latent were perfect.</p>
      </div>
    </div>
    <p class="muted">If synthetic ≈ floor, the bottleneck is the decoder. If synthetic ≫ floor, the bottleneck is donors/weights.</p>
    <div class="fig">
      <img src="../notebooks/ts_SCM_ASCM/panel_decode_example.png" alt="treatment_0001 Sentinel-2 P09 true color: observed, SCM synthetic decoded, and reconstruction floor" />
      <div class="cap">treatment_0001, Sentinel-2, held-out P09. The synthetic is a spatial average; the floor is a real reconstruction of the same chip.</div>
    </div>
    <div class="fig">
      <img src="../notebooks/ts_SCM_ASCM/panel_decode_validation_features.png" alt="Mean absolute feature error of SCM and ASCM synthetics versus the reconstruction floor, P09/P10" />
      <div class="cap">Mean |decoded − observed| over 10 sites × P09/P10, native units. Source: panel_decode_validation.csv.</div>
    </div>

  <template id="s8">
    <h1>Post-period effects, and vs feature SCM</h1>

  <script>
    const LABELS = ["Title", "Design", "Encode", "kNN", "Metric", "SCM", "ASCM", "Decode", "Effects", "Takeaway"];
    const n = LABELS.length;
    let i = 0;
    const stage = document.getElementById("stage");
    const pills = document.getElementById("pills");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const count = document.getElementById("count");

    LABELS.forEach((label, k) => {
      const b = document.createElement("button");
      b.className = "pill";
      b.type = "button";
      b.textContent = label;
      b.addEventListener("click", () => go(k));
      pills.appendChild(b);
    });

    function go(k) {
      i = Math.max(0, Math.min(n - 1, k));
      const tpl = document.getElementById("s" + i);
      stage.replaceChildren(tpl.content.cloneNode(true));
      [...pills.children].forEach((el, j) => el.classList.toggle("active", j === i));
      prev.disabled = i === 0;
      next.disabled = i === n - 1;
      count.textContent = (i + 1) + " / " + n;
      history.replaceState(null, "", "#s" + i);
    }

    prev.addEventListener("click", () => go(i - 1));
    next.addEventListener("click", () => go(i + 1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") go(i + 1);
      if (e.key === "ArrowLeft" || e.key === "PageUp") go(i - 1);
      if (e.key === "Home") go(0);
      if (e.key === "End") go(n - 1);
    });

    const hash = parseInt((location.hash.match(/s(\d+)/) || [])[1], 10);
    go(Number.isFinite(hash) ? hash : 0);
  </script>
